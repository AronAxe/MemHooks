name: Publish Token Terminator crate v0.5.1

on:
  push:
    branches: [publish-token-terminator-v051]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.78.0

      - name: Fetch exact Token Terminator release tree
        run: |
          git clone https://github.com/AronAxe/Token-Terminator.git token-terminator
          cd token-terminator
          git checkout 60d83cad3829e5837e54109002694faf0c0f1798
          test "$(grep '^version = ' Cargo.toml | head -1)" = 'version = "0.5.1"'

      - name: Publish v0.5.1 if absent
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if curl -fsS https://crates.io/api/v1/crates/token-terminator/0.5.1 >/dev/null 2>&1; then
            echo "token-terminator 0.5.1 already exists on crates.io"
            exit 0
          fi
          test -n "$CARGO_REGISTRY_TOKEN"
          cd token-terminator
          rm -f Cargo.lock
          cargo publish --token "$CARGO_REGISTRY_TOKEN"
