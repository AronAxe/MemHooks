name: Publish MemHooks v0.4.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-crate-v0.4.1.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish memhooks 0.4.1 to crates.io
        env:
          TOKEN_PRIMARY: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TOKEN_FALLBACK: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -n "$TOKEN_PRIMARY" ]; then
            export CARGO_REGISTRY_TOKEN="$TOKEN_PRIMARY"
          elif [ -n "$TOKEN_FALLBACK" ]; then
            export CARGO_REGISTRY_TOKEN="$TOKEN_FALLBACK"
          else
            echo "No crates.io token is configured in CARGO_REGISTRY_TOKEN or CRATES_IO_TOKEN."
            exit 78
          fi
          rm -f Cargo.lock
          cargo publish

      - name: Create GitHub v0.4.1 release
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN_TARGET: ${{ github.event.before }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          **MemHooks v0.4.1** makes the Rust reference implementation installable through crates.io while keeping the `memhooks/v1` protocol unchanged.

          ## Highlights

          - Published the `memhooks` Rust crate and CLI to crates.io.
          - Install the CLI with `cargo install memhooks`.
          - Add the reusable library to a Rust agent/runtime with `cargo add memhooks`.
          - Added crates.io/docs.rs package metadata and a lean package include set.
          - Added `cargo publish --dry-run` to CI so the exact package is continuously verified.
          - Updated the README with plain-language CLI/library installation and usage.
          - Weighted retrieval, entity salience, role routing, and inheritance semantics are unchanged from v0.4.0.
          EOF

          if gh release view v0.4.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.4.1 already exists; nothing to do."
            exit 0
          fi

          gh release create v0.4.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$CLEAN_TARGET" \
            --title "MemHooks v0.4.1" \
            --notes-file /tmp/release-notes.md
