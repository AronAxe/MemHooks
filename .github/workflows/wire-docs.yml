name: Wire MemHooks documentation

on:
  push:
    branches:
      - docs-v0.4.1
    paths:
      - .github/workflows/wire-docs.yml

permissions:
  contents: write

jobs:
  wire-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-v0.4.1
      - name: Link documentation and docs.rs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          section_lines = [
              "## Documentation",
              "",
              "Start with the [documentation index](docs/README.md), or jump directly to:",
              "",
              "- [Quickstart](docs/quickstart.md)",
              "- [CLI reference](docs/cli.md)",
              "- [Rust library/API guide](docs/rust-library.md)",
              "- [Agent integration guide](docs/integrating-an-agent.md)",
              "- [Protocol guide](docs/protocol-guide.md)",
              "- [Troubleshooting](docs/troubleshooting.md)",
              "- [Crate publishing notes](docs/publishing.md)",
              "",
              "The normative format contract remains [`references/memhooks-format.md`](references/memhooks-format.md).",
              "",
          ]
          section = "\n".join(section_lines)
          marker = "## Install the Rust tooling"
          if "## Documentation\n" not in text:
              if marker not in text:
                  raise SystemExit(f"README marker not found: {marker}")
              text = text.replace(marker, section + marker, 1)
              readme.write_text(text, encoding="utf-8")

          cargo = Path("Cargo.toml")
          cargo_text = cargo.read_text(encoding="utf-8")
          old = 'include = ["Cargo.toml", "LICENSE", "README.md", "src/**"]'
          new = 'include = ["Cargo.toml", "LICENSE", "README.md", "src/**", "docs/**"]'
          if old in cargo_text:
              cargo_text = cargo_text.replace(old, new, 1)
              cargo.write_text(cargo_text, encoding="utf-8")
          elif new not in cargo_text:
              raise SystemExit("Cargo include list was not in the expected form")

          lib = Path("src/lib.rs")
          lib_text = lib.read_text(encoding="utf-8")
          directive = '#![doc = include_str!("../docs/rust-library.md")]'
          if directive not in lib_text:
              lib.write_text(directive + "\n\n" + lib_text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md Cargo.toml src/lib.rs
          if git diff --cached --quiet; then
            echo "Documentation wiring already applied."
          else
            git commit -m "docs: link guides and expose docs.rs landing page"
            git push origin HEAD:docs-v0.4.1
          fi
