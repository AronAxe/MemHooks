name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --locked --all-targets --all-features
      - name: Rust doctests
        run: cargo test --locked --doc
      - name: Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
      - name: Validate repository MemHooks
        run: cargo run --locked --quiet -- validate --all
      - name: Verify package manifest on pull requests
        if: github.event_name == 'pull_request'
        run: cargo package --locked --no-verify
      - name: Verify crates.io publication on main and tags
        if: github.event_name == 'push'
        run: cargo publish --dry-run --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install declared Rust 1.78 toolchain
        run: rustup toolchain install 1.78.0 --profile minimal
      - name: Check declared MSRV
        run: cargo +1.78.0 check --locked --all-targets

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python test tools
        run: python -m pip install --disable-pip-version-check "pytest>=8,<10" ruff
      - name: Python syntax
        run: python -m compileall -q hooks scripts tests
      - name: Python lint
        run: ruff check hooks scripts tests
      - name: Python regression tests
        run: pytest -q
