name: Publish MemHooks v0.5.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.5.0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish memhooks 0.5.0 to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TOKEN_FALLBACK: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ] && [ -n "$TOKEN_FALLBACK" ]; then
            export CARGO_REGISTRY_TOKEN="$TOKEN_FALLBACK"
          fi
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "No crates.io publishing token is configured."
            exit 78
          fi
          rm -f Cargo.lock
          cargo publish

      - name: Verify public registry install
        run: |
          set -e
          for attempt in 1 2 3 4 5 6; do
            rm -rf "$RUNNER_TEMP/memhooks-v050"
            if cargo install memhooks --version 0.5.0 --root "$RUNNER_TEMP/memhooks-v050"; then
              "$RUNNER_TEMP/memhooks-v050/bin/memhooks" --version | tee /tmp/memhooks-version.txt
              grep -q '0.5.0' /tmp/memhooks-version.txt
              exit 0
            fi
            echo "Registry index has not exposed 0.5.0 yet; retrying..."
            sleep 5
          done
          exit 1

      - name: Create GitHub v0.5.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          **MemHooks v0.5.0** introduces `memhooks/v2`: a clean backend-neutral retrieval-routing protocol.

          ## Highlights

          - Universal core now contains only backend-neutral retrieval intent: queries, priority, roles, entities, resources, tags, exclusions, scope, sensitivity and inheritance.
          - Provider-native controls live exclusively under opaque `backends.<provider>` namespaces.
          - Hindsight `bank`, memory types, connection emphasis, Reflect, Mental Models and Knowledge Pages no longer leak into the core.
          - Added first-class provider references for Hindsight, OpenViking, Honcho and Mem0.
          - Mem0 mapping covers current scoped filters plus `top_k`, `threshold`, reranking and Graph Memory hints while keeping them provider-owned.
          - Provider namespace mappings merge structurally root→leaf; query-local provider configuration overlays scope-level configuration.
          - Added generic named `resources` cues with open `kind` and salience metadata.
          - Runtime resolution rejects unsupported schema versions rather than silently dropping provider-specific data.
          - Zero-LLM maintenance now uses generic entities/resources/tags plus opaque provider hints; Hindsight-specific note flags were removed.
          - Documentation now states the intended ownership clearly: users enable MemHooks; agents/runtimes maintain and prune local hook files.

          `memhooks 0.5.0` is published on crates.io and the public installation path is verified with `cargo install memhooks --version 0.5.0`.
          EOF

          gh release create v0.5.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target fefcdaa1296dbb210a81fa7f37c188337444370c \
            --title "MemHooks v0.5.0" \
            --notes-file /tmp/release-notes.md

      - name: Remove one-shot publisher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/publish-v0.5.0.yml
          git commit -m "chore: remove v0.5.0 publisher"
          git push origin HEAD:main
