name: Patch Wiki Link

on:
  push:
    branches: [wiki-docs]
    paths:
      - ".github/workflows/patch-wiki-link.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: wiki-docs

      - name: Add wiki link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("README.md")
          text = path.read_text()
          old = "## Documentation\n\n- [Documentation index](docs/README.md)"
          new = "## Documentation\n\n- [Human-friendly Wiki source](wiki/Home.md) — approachable, cross-linked explanation intended for the GitHub Wiki tab\n- [Documentation index](docs/README.md)"
          if old not in text:
              raise SystemExit("documentation anchor not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit and remove helper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git rm .github/workflows/patch-wiki-link.yml
          git commit -m "docs: link MemHooks Wiki from README"
          git push origin HEAD:wiki-docs
