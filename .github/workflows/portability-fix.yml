name: Native path correction
on:
  push:
    branches: [fix/review-hardening-0.6.0]
    paths: [.github/workflows/portability-fix.yml]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/review-hardening-0.6.0
      - name: Correct platform-specific import and path assertion
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          changes = {
              'src/maintainer.rs': ('2882efa330ba20fcac5b884fdbb2b9a178471e2a9ec7d13687f95f029c2971ea', [
                  ('use std::fs::{self, File};', 'use std::fs;'),
                  ('File::open(parent)', 'fs::File::open(parent)')]),
              'tests/maintainer.rs': ('5869ac54d69aee49b455250774e9363de95136d0f07b3fe7c1061d22a5960231', [
                  ('assert!(error.to_string().contains(&repo.display().to_string()));',
                   'match error {\n        memhooks::MaintainerError::NotEnabled(path) => assert_eq!(path, repo.canonicalize().unwrap()),\n        other => panic!("expected disabled repository boundary, got {other}"),\n    }')]),
          }
          for name, (checksum, edits) in changes.items():
              path = Path(name)
              assert hashlib.sha256(path.read_bytes()).hexdigest() == checksum, name
              text = path.read_text()
              for old, new in edits:
                  assert text.count(old) == 1, (name, old)
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          cargo fmt --all
      - name: Commit correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/maintainer.rs tests/maintainer.rs
          git commit -m 'fix: use native canonical path assertions and platform-clean imports'
          git push origin HEAD:refs/heads/fix/review-hardening-0.6.0
