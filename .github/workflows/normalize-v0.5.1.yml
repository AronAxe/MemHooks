name: Normalize v0.5.1

on:
  push:
    branches: [v0.5.1]
    paths:
      - .github/workflows/normalize-v0.5.1.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: v0.5.1
      - name: Format and generate lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile
      - name: Commit normalized tree and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests Cargo.lock
          git rm .github/workflows/normalize-v0.5.1.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format v0.5.1 and lock dependencies"
          git push origin HEAD:v0.5.1
