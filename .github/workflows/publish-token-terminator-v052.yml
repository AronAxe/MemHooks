name: Publish token-terminator v0.5.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-token-terminator-v052.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Token Terminator release tree
        run: |
          git clone --quiet https://github.com/AronAxe/Token-Terminator.git token-terminator
          cd token-terminator
          git checkout --quiet b994d5866925624ef0c012a5e9e7e9e577e7331e
          test "$(git rev-parse HEAD)" = "b994d5866925624ef0c012a5e9e7e9e577e7331e"
          grep -q '^version = "0.5.2"$' Cargo.toml

      - uses: dtolnay/rust-toolchain@1.78.0

      - name: Verify crate
        working-directory: token-terminator
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
          cargo publish --dry-run

      - name: Publish crate
        working-directory: token-terminator
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
