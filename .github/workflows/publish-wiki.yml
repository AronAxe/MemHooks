name: Publish Wiki

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - ".github/workflows/publish-wiki.yml"

permissions:
  contents: write

concurrency:
  group: publish-memhooks-wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Publish managed wiki pages
        env:
          GH_TOKEN: ${{ secrets.WIKI_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          PUBLIC_WIKI_URL="https://github.com/${REPOSITORY}.wiki.git"
          if ! git ls-remote "$PUBLIC_WIKI_URL" HEAD >/dev/null 2>&1; then
            echo "::error::Wiki storage is unavailable or uninitialized. No wiki update was published."
            exit 1
          fi
          WIKI_DIR="$(mktemp -d)"
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.wiki.git" "$WIKI_DIR"
          # Only overwrite source-managed pages; preserve separately authored pages.
          cp -a wiki/. "$WIKI_DIR"/
          cd "$WIKI_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "docs: sync MemHooks wiki from ${GITHUB_SHA}"
            git push --quiet origin HEAD
          fi
          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git ls-remote origin HEAD | cut -f1)"
          test "$LOCAL_SHA" = "$REMOTE_SHA"
          echo "Verified wiki commit: $REMOTE_SHA"
