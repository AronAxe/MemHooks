name: Build Favicon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-favicon.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build multi-size favicon from committed logo
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path('assets/memhooklogo.png')
          out = Path('assets/favicon.ico')

          im = Image.open(src).convert('RGBA')
          print(f'Source logo: {im.width}x{im.height}')

          alpha = im.getchannel('A')
          bbox = alpha.getbbox()
          if bbox:
              im = im.crop(bbox)

          # Preserve the exact committed artwork, centered on a transparent square.
          pad = max(2, round(max(im.size) * 0.08))
          side = max(im.size) + pad * 2
          canvas = Image.new('RGBA', (side, side), (0, 0, 0, 0))
          x = (side - im.width) // 2
          y = (side - im.height) // 2
          canvas.alpha_composite(im, (x, y))

          sizes = [(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)]
          canvas.save(out, format='ICO', sizes=sizes)
          canvas.resize((256,256), Image.Resampling.LANCZOS).save('assets/favicon-256.png')
          print(f'Created {out} from {src} with ICO sizes: {sizes}')
          PY

      - name: Commit favicon and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/favicon.ico assets/favicon-256.png
          git rm .github/workflows/build-favicon.yml
          git commit -m "assets: add favicon generated from MemHooks logo"
          git push
