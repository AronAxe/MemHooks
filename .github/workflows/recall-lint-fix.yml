name: Native recall lint correction
on:
  push:
    branches: [feat/native-hermes-hindsight-recall]
    paths: [.github/workflows/recall-lint-fix.yml]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/native-hermes-hindsight-recall
      - name: Apply verified boundary corrections
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          checksums = {
              'hooks/hermes/hindsight_recall.py': '55756cb0044307e03af1439e3632b83bd406f7585a5e9127e56a536b6fe933d4',
              'hooks/hermes/recall_runtime.py': '55f489fb31f26f6e947448ef0d026c576eab5a41b806da44f436f6776328d801',
              'tests/test_native_recall.py': '13df5142f49a8bc944edf2a7bfdae9fa09f0c6c521fecb6eac9f86243ca9e79e',
          }
          for name, checksum in checksums.items():
              p = Path(name)
              assert hashlib.sha256(p.read_bytes()).hexdigest() == checksum, name
              s = p.read_text()
              s = s.replace('raise ValueError("malformed recall response")', 'raise TypeError("malformed recall response")')
              s = s.replace('raise ValueError("invalid_provider_options")', 'raise TypeError("invalid_provider_options")')
              s = s.replace('except ValueError as error:', 'except (ValueError, TypeError) as error:')
              # Broad catches are deliberate only at host/worker trust boundaries:
              # logging raw exception text/tracebacks could expose credentials.
              s = s.replace('except Exception:', 'except Exception:  # noqa: BLE001 - secret-safe host/worker boundary')
              s = s.replace('except Exception as error:', 'except Exception as error:  # noqa: BLE001 - secret-safe host boundary')
              p.write_text(s)
          PY
          python3 -m pip install --disable-pip-version-check ruff
          ruff check --fix hooks/hermes/hindsight_recall.py hooks/hermes/recall_runtime.py tests/test_native_recall.py
          ruff check hooks scripts tests
      - name: Commit corrections on feature branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hooks/hermes/hindsight_recall.py hooks/hermes/recall_runtime.py tests/test_native_recall.py
          git commit -m 'style: clarify secret-safe exception boundaries and organize imports'
          git push origin HEAD:refs/heads/feat/native-hermes-hindsight-recall
