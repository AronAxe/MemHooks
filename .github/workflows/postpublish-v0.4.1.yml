name: Finalize crates.io publication

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/postpublish-v0.4.1.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify crates.io installation
        run: |
          cargo install memhooks --version 0.4.1 --root "$RUNNER_TEMP/memhooks-registry"
          "$RUNNER_TEMP/memhooks-registry/bin/memhooks" --version | tee /tmp/memhooks-version.txt
          grep -q '0.4.1' /tmp/memhooks-version.txt

      - name: Update published status and maintainer docs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          badge = '  <img alt="Crates.io" src="https://img.shields.io/crates/v/memhooks" />\n'
          anchor = '  <img alt="Memory agnostic" src="https://img.shields.io/badge/memory-backend%20agnostic-2ea44f" />\n'
          if badge not in text and anchor in text:
              text = text.replace(anchor, anchor + badge, 1)
          text = text.replace('Once published on crates.io, installation is simply:', 'Install the CLI directly from crates.io:')
          text = text.replace('**v0.4.1 — experimental convention + crates.io-ready Rust reference resolver/linter + deterministic load-and-maintain runtime.**', '**v0.4.1 — experimental convention + published Rust reference resolver/linter + deterministic load-and-maintain runtime.**')
          readme.write_text(text, encoding='utf-8')

          publishing = Path('docs/publishing.md')
          p = publishing.read_text(encoding='utf-8')
          old = '''## Current state\n\nMemHooks v0.4.1 is package-tested and passes:\n\n```bash\ncargo publish --dry-run\n```\n\nThe first real crates.io upload is still waiting for the crate owner's one-time registry authentication.\n'''
          new = '''## Current state\n\nMemHooks v0.4.1 is published on crates.io. The package is continuously checked with:\n\n```bash\ncargo publish --dry-run\n```\n\nThe v0.4.1 publication was also verified by installing the registry release with `cargo install memhooks --version 0.4.1` and running the installed binary.\n'''
          if old in p:
              p = p.replace(old, new, 1)
          p = p.replace('## First publication\n', '## First publication (completed for v0.4.1)\n', 1)
          p = p.replace('6. Rerun the prepared v0.4.1 publishing workflow or run locally:', '6. Publish with the prepared workflow or run locally:', 1)
          publishing.write_text(p, encoding='utf-8')
          PY

      - name: Update GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          **MemHooks v0.4.1** publishes the Rust reference resolver/linter to crates.io while keeping the `memhooks/v1` protocol unchanged.

          ## Highlights

          - `memhooks 0.4.1` is published on crates.io.
          - Install the CLI with `cargo install memhooks`.
          - Add the reusable Rust library with `cargo add memhooks`.
          - The registry release was verified by installing `memhooks 0.4.1` from crates.io and running the installed binary.
          - Added crates.io/docs.rs metadata and a lean crate package.
          - CI verifies Rust formatting, Clippy, tests, Rustdoc, MemHooks self-validation, Python regressions, and `cargo publish --dry-run`.
          - Weighted retrieval, entity salience, role routing, and inheritance semantics remain backward-compatible with `memhooks/v1`.

          Documentation is maintained under `docs/` on `main`, with the Rust library guide used as the crate-level docs.rs landing page.
          EOF
          gh release edit v0.4.1 --repo "$GITHUB_REPOSITORY" --notes-file /tmp/release-notes.md

      - name: Remove completed one-shot workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/publish-crate-v0.4.1.yml .github/workflows/postpublish-v0.4.1.yml
          git add README.md docs/publishing.md
          git commit -m "docs: mark memhooks 0.4.1 published on crates.io"
          git push origin HEAD:main
