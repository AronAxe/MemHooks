[package]
name = "memhooks"
version = "0.5.1"
edition = "2021"
rust-version = "1.78"
description = "Backend-neutral parser, resolver, validator, maintainer, and CLI for filesystem-scoped AI agent memory routing"
license = "MIT"
repository = "https://github.com/AronAxe/MemHooks"
homepage = "https://github.com/AronAxe/MemHooks"
documentation = "https://docs.rs/memhooks"
readme = "README.md"
keywords = ["ai", "agents", "memory", "context", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = [
  "Cargo.toml",
  "Cargo.lock",
  "LICENSE",
  "README.md",
  "SECURITY.md",
  "CONTRIBUTING.md",
  "src/**",
  "docs/**",
  "references/**",
]

[dependencies]
# Pin dependency families whose newest releases now require Edition 2024 / newer Rust.
clap = { version = "=4.5.27", features = ["derive"] }
fs2 = "0.4"
ignore = "=0.4.23"
globset = "=0.4.15"
# Keep serde_yaml_ng/hashlink from selecting the Edition-2024 indexmap line.
indexmap = "=2.7.1"
# 0.0.6 provides marked YAML spans while remaining compatible with the Rust 1.78 floor.
saphyr = { version = "=0.0.6", default-features = false }
# Saphyr 0.0.6 accepts newer 5.x releases; keep this on a Rust-1.78-compatible line.
ordered-float = "=5.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "=3.10.1"
thiserror = "2"
