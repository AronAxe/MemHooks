[package]
name = "memhooks"
version = "0.4.1"
edition = "2021"
rust-version = "1.78"
description = "Reference parser, resolver, validator, and CLI for filesystem-scoped AI agent memory routing"
license = "MIT"
repository = "https://github.com/AronAxe/MemHooks"
homepage = "https://github.com/AronAxe/MemHooks"
documentation = "https://docs.rs/memhooks"
readme = "README.md"
keywords = ["ai", "agents", "memory", "context", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["Cargo.toml", "LICENSE", "README.md", "src/**"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
