[package]
name = "memhooks"
version = "0.5.1"
edition = "2021"
rust-version = "1.78"
description = "Backend-neutral parser, resolver, validator, maintainer, and CLI for filesystem-scoped AI agent memory routing"
license = "MIT"
repository = "https://github.com/AronAxe/MemHooks"
homepage = "https://github.com/AronAxe/MemHooks"
documentation = "https://docs.rs/memhooks"
readme = "README.md"
keywords = ["ai", "agents", "memory", "context", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = [
  "Cargo.toml",
  "Cargo.lock",
  "LICENSE",
  "README.md",
  "SECURITY.md",
  "CONTRIBUTING.md",
  "src/**",
  "docs/**",
  "references/**",
]

[dependencies]
clap = { version = "=4.5.27", features = ["derive"] }
fs2 = "0.4"
# Keep the traversal stack compatible with the declared Rust 1.78 MSRV.
ignore = "=0.4.23"
# `ignore 0.4.23` accepts newer 0.4.x globset releases whose MSRV later rose to 1.88.
globset = "=0.4.15"
saphyr = { version = "0.0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "=3.10.1"
thiserror = "2"
