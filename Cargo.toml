[package]
name = "memhooks"
version = "0.4.0"
edition = "2021"
rust-version = "1.78"
description = "Reference parser, resolver, and linter for MEMHOOKS.md"
license = "MIT"
repository = "https://github.com/AronAxe/MemHooks"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
